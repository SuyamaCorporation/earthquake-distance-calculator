<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earthquake Epicenter Distance Calculator</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px);} to {opacity:1; transform:translateY(0);} }
  .fade-in { animation: fadeIn 0.3s ease; }
  .result-box { background: linear-gradient(135deg, #f0f9ff, #e0e7ff); }
</style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="max-w-3xl mx-auto px-4 py-6">
  <h1 class="text-2xl font-bold text-blue-700 mb-1">震源距離計算機</h1>
  <p class="text-gray-500 text-sm mb-6">P波・S波の到着時刻から震源までの距離を計算</p>

  <!-- Preset Library -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-5">
    <h2 class="font-semibold text-gray-700 text-sm mb-3">歴史的地震サンプル</h2>
    <div class="flex flex-wrap gap-2" id="presets-container"></div>
  </div>

  <!-- Inputs -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-5">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="p-time">P波到着時刻 (HH:MM:SS.ms)</label>
        <input id="p-time" type="text" value="12:00:05.00" placeholder="12:00:05.00"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
          aria-label="P波到着時刻">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="s-time">S波到着時刻 (HH:MM:SS.ms)</label>
        <input id="s-time" type="text" value="12:00:13.50" placeholder="12:00:13.50"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
          aria-label="S波到着時刻">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="vp">P波速度 (km/s)</label>
        <input id="vp" type="number" value="6.0" step="0.1" min="0.1"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
          aria-label="P波速度">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="vs">S波速度 (km/s)</label>
        <input id="vs" type="number" value="3.5" step="0.1" min="0.1"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
          aria-label="S波速度">
      </div>
    </div>
    <div class="mt-4 flex gap-3">
      <button onclick="calculate()" class="px-5 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 transition font-medium" aria-label="計算する">計算する</button>
      <button onclick="resetForm()" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm rounded-lg hover:bg-gray-200 transition" aria-label="リセット">リセット</button>
    </div>
    <div id="error-msg" class="hidden mt-2 text-sm text-red-600"></div>
  </div>

  <!-- Result -->
  <div id="result-area" class="hidden fade-in">
    <div class="result-box rounded-xl border border-blue-100 p-5 mb-5">
      <h2 class="font-semibold text-gray-700 mb-3">計算結果</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-4">
        <div class="bg-white rounded-lg p-3 text-center shadow-sm">
          <div class="text-xs text-gray-400 mb-1">時間差 (Δt)</div>
          <div id="res-dt" class="text-xl font-bold text-blue-700">--</div>
          <div class="text-xs text-gray-400">秒</div>
        </div>
        <div class="bg-white rounded-lg p-3 text-center shadow-sm">
          <div class="text-xs text-gray-400 mb-1">震源距離</div>
          <div id="res-dist" class="text-xl font-bold text-indigo-700">--</div>
          <div class="text-xs text-gray-400">km</div>
        </div>
        <div class="bg-white rounded-lg p-3 text-center shadow-sm col-span-2 sm:col-span-1">
          <div class="text-xs text-gray-400 mb-1">P波到着から震源</div>
          <div id="res-p-travel" class="text-xl font-bold text-green-700">--</div>
          <div class="text-xs text-gray-400">秒 (P波走時)</div>
        </div>
      </div>
      <!-- Formula explanation -->
      <div class="bg-white rounded-lg p-4 border border-blue-50">
        <p class="text-xs font-semibold text-gray-500 mb-2">計算式の説明</p>
        <div class="text-sm text-gray-600 space-y-1" id="formula-explain"></div>
      </div>
    </div>

    <!-- Chart -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
      <h2 class="font-semibold text-gray-700 mb-3">走時曲線グラフ</h2>
      <svg id="chart" viewBox="0 0 560 320" class="w-full" role="img" aria-label="P波・S波走時曲線グラフ"></svg>
      <div class="flex gap-4 mt-2 text-xs text-gray-500 justify-center">
        <span><span class="inline-block w-6 h-0.5 bg-blue-500 align-middle mr-1"></span>P波</span>
        <span><span class="inline-block w-6 h-0.5 bg-red-500 align-middle mr-1"></span>S波</span>
        <span><span class="inline-block w-3 h-3 bg-green-500 rounded-full inline-block align-middle mr-1"></span>観測点</span>
      </div>
    </div>
  </div>
</div>

<script>
// ── Presets ────────────────────────────────────────────────
const PRESETS = [
  { name: '1995年兵庫県南部', p: '05:46:52.00', s: '05:47:04.00', vp: 6.0, vs: 3.5 },
  { name: '2011年東北地方太平洋沖', p: '14:46:18.00', s: '14:46:43.00', vp: 6.5, vs: 3.7 },
  { name: '2016年熊本地震', p: '01:25:06.00', s: '01:25:18.00', vp: 6.0, vs: 3.5 },
  { name: '1923年関東大震災', p: '11:58:40.00', s: '11:59:05.00', vp: 5.8, vs: 3.3 },
  { name: '2004年新潟県中越地震', p: '17:56:02.00', s: '17:56:14.00', vp: 6.0, vs: 3.5 },
];

const container = document.getElementById('presets-container');
PRESETS.forEach(p => {
  const btn = document.createElement('button');
  btn.textContent = p.name;
  btn.className = 'px-3 py-1 text-xs border border-blue-200 text-blue-700 rounded-full hover:bg-blue-50 transition';
  btn.setAttribute('aria-label', `${p.name}のサンプルを読み込む`);
  btn.addEventListener('click', () => {
    document.getElementById('p-time').value = p.p;
    document.getElementById('s-time').value = p.s;
    document.getElementById('vp').value = p.vp;
    document.getElementById('vs').value = p.vs;
    calculate();
  });
  container.appendChild(btn);
});

// ── Parse time ─────────────────────────────────────────────
function parseTime(str) {
  const m = str.trim().match(/^(\d{1,2}):(\d{2}):(\d{2}(?:\.\d+)?)$/);
  if (!m) return null;
  return parseInt(m[1]) * 3600 + parseInt(m[2]) * 60 + parseFloat(m[3]);
}

// ── Calculate ──────────────────────────────────────────────
function calculate() {
  const errEl = document.getElementById('error-msg');
  errEl.classList.add('hidden');

  const pTime = parseTime(document.getElementById('p-time').value);
  const sTime = parseTime(document.getElementById('s-time').value);
  const vp = parseFloat(document.getElementById('vp').value);
  const vs = parseFloat(document.getElementById('vs').value);

  if (pTime === null || sTime === null) {
    errEl.textContent = '時刻の形式が正しくありません（HH:MM:SS.ms）';
    errEl.classList.remove('hidden'); return;
  }
  if (isNaN(vp) || isNaN(vs) || vp <= 0 || vs <= 0) {
    errEl.textContent = '波速に正の数値を入力してください';
    errEl.classList.remove('hidden'); return;
  }
  if (sTime <= pTime) {
    errEl.textContent = 'S波到着時刻はP波より後である必要があります';
    errEl.classList.remove('hidden'); return;
  }
  if (vs >= vp) {
    errEl.textContent = 'P波速度はS波速度より大きい必要があります';
    errEl.classList.remove('hidden'); return;
  }

  const dt = sTime - pTime;
  const dist = (vp * vs) / (vp - vs) * dt;
  const pTravel = dist / vp;

  document.getElementById('res-dt').textContent = dt.toFixed(2);
  document.getElementById('res-dist').textContent = dist.toFixed(1);
  document.getElementById('res-p-travel').textContent = pTravel.toFixed(2);

  const explain = document.getElementById('formula-explain');
  explain.textContent = '';
  const lines = [
    `① 時間差 Δt = t_S − t_P = ${dt.toFixed(2)} 秒`,
    `② 公式: D = (V_P × V_S) / (V_P − V_S) × Δt`,
    `③ 代入: D = (${vp} × ${vs}) / (${vp} − ${vs}) × ${dt.toFixed(2)}`,
    `④ = ${(vp * vs).toFixed(2)} / ${(vp - vs).toFixed(2)} × ${dt.toFixed(2)}`,
    `⑤ = ${((vp * vs) / (vp - vs)).toFixed(2)} × ${dt.toFixed(2)} = ${dist.toFixed(1)} km`,
    `⑥ P波走時 t_P = D / V_P = ${dist.toFixed(1)} / ${vp} = ${pTravel.toFixed(2)} 秒`,
  ];
  lines.forEach(l => {
    const p = document.createElement('p');
    p.textContent = l;
    explain.appendChild(p);
  });

  document.getElementById('result-area').classList.remove('hidden');
  drawChart(vp, vs, dist, dt);
}

// ── Chart ──────────────────────────────────────────────────
function drawChart(vp, vs, dist, dt) {
  const svg = document.getElementById('chart');
  svg.textContent = '';
  const W = 560, H = 320;
  const PAD = { l: 55, r: 20, t: 20, b: 40 };
  const cW = W - PAD.l - PAD.r, cH = H - PAD.t - PAD.b;

  const maxD = dist * 1.7;
  const maxT = maxD / vs * 1.1;

  function sx(d) { return PAD.l + (d / maxD) * cW; }
  function sy(t) { return PAD.t + cH - (t / maxT) * cH; }

  function el(tag, attrs, parent) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
    if (parent) parent.appendChild(e);
    return e;
  }

  // Grid
  for (let i = 0; i <= 4; i++) {
    const d = maxD / 4 * i;
    el('line', { x1: sx(d), y1: PAD.t, x2: sx(d), y2: PAD.t + cH, stroke: '#e5e7eb', 'stroke-width': '1' }, svg);
    el('text', { x: sx(d), y: PAD.t + cH + 16, 'text-anchor': 'middle', fill: '#9ca3af', 'font-size': '10' }, svg).textContent = Math.round(d) + ' km';
    const t = maxT / 4 * i;
    el('line', { x1: PAD.l, y1: sy(t), x2: PAD.l + cW, y2: sy(t), stroke: '#e5e7eb', 'stroke-width': '1' }, svg);
    el('text', { x: PAD.l - 6, y: sy(t) + 4, 'text-anchor': 'end', fill: '#9ca3af', 'font-size': '10' }, svg).textContent = t.toFixed(1) + 's';
  }

  // Axes
  el('line', { x1: PAD.l, y1: PAD.t, x2: PAD.l, y2: PAD.t + cH, stroke: '#6b7280', 'stroke-width': '1.5' }, svg);
  el('line', { x1: PAD.l, y1: PAD.t + cH, x2: PAD.l + cW, y2: PAD.t + cH, stroke: '#6b7280', 'stroke-width': '1.5' }, svg);
  el('text', { x: PAD.l + cW / 2, y: H - 4, 'text-anchor': 'middle', fill: '#6b7280', 'font-size': '11' }, svg).textContent = '震源距離 (km)';
  const ytitle = el('text', { x: 12, y: PAD.t + cH / 2, 'text-anchor': 'middle', fill: '#6b7280', 'font-size': '11', transform: `rotate(-90, 12, ${PAD.t + cH / 2})` }, svg);
  ytitle.textContent = '走時 (秒)';

  // P wave line
  const pts = 60;
  let pPath = '', sPath = '';
  for (let i = 0; i <= pts; i++) {
    const d = maxD / pts * i;
    const tp = d / vp, ts = d / vs;
    pPath += (i === 0 ? 'M' : 'L') + sx(d) + ',' + sy(tp);
    sPath += (i === 0 ? 'M' : 'L') + sx(d) + ',' + sy(ts);
  }
  el('path', { d: pPath, fill: 'none', stroke: '#3b82f6', 'stroke-width': '2' }, svg);
  el('path', { d: sPath, fill: 'none', stroke: '#ef4444', 'stroke-width': '2' }, svg);

  // Observation point
  const tpObs = dist / vp;
  const tsObs = dist / vs;
  // Vertical line at dist
  el('line', { x1: sx(dist), y1: PAD.t, x2: sx(dist), y2: PAD.t + cH, stroke: '#22c55e', 'stroke-width': '1.5', 'stroke-dasharray': '4,3' }, svg);
  // P arrival dot
  el('circle', { cx: sx(dist), cy: sy(tpObs), r: '5', fill: '#3b82f6', stroke: 'white', 'stroke-width': '2' }, svg);
  // S arrival dot
  el('circle', { cx: sx(dist), cy: sy(tsObs), r: '5', fill: '#ef4444', stroke: 'white', 'stroke-width': '2' }, svg);
  // Δt bracket
  el('line', { x1: sx(dist) + 8, y1: sy(tpObs), x2: sx(dist) + 8, y2: sy(tsObs), stroke: '#16a34a', 'stroke-width': '1.5' }, svg);
  el('text', { x: sx(dist) + 12, y: (sy(tpObs) + sy(tsObs)) / 2 + 4, fill: '#16a34a', 'font-size': '10' }, svg).textContent = `Δt=${dt.toFixed(1)}s`;

  // Distance label
  el('text', { x: sx(dist), y: PAD.t + cH - 5, 'text-anchor': 'middle', fill: '#16a34a', 'font-size': '10', 'font-weight': 'bold' }, svg).textContent = dist.toFixed(0) + 'km';
}

function resetForm() {
  document.getElementById('p-time').value = '12:00:05.00';
  document.getElementById('s-time').value = '12:00:13.50';
  document.getElementById('vp').value = '6.0';
  document.getElementById('vs').value = '3.5';
  document.getElementById('result-area').classList.add('hidden');
  document.getElementById('error-msg').classList.add('hidden');
}
</script>
</body>
</html>
